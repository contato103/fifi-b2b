<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recebemos! | FIFI Revenda</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b3a2c">
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="styles.css?v=12">
  <style>
    .thanks {
      min-height: calc(100svh - var(--header-h));
      padding: clamp(48px, 8vw, 120px) var(--pad-x);
      display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(32px, 6vw, 96px); align-items: center;
      background: radial-gradient(90% 70% at 85% 45%, color-mix(in oklch, var(--green-700) 38%, transparent), transparent 70%), var(--green-900);
      color: var(--on-dark);
    }
    .check {
      width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
      background: var(--lime); margin-bottom: var(--space-2xl);
    }
    .check svg { width: 34px; height: 34px; fill: none; stroke: var(--green-950); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .thanks h1 { color: var(--white); font-size: clamp(2.4rem, 1.4rem + 4vw, 5rem); }
    .thanks p { margin-top: var(--space-xl); font-size: clamp(1.05rem, 1rem + .4vw, 1.3rem); max-width: 44ch; }
    .thanks-actions { margin-top: var(--space-2xl); display: flex; align-items: center; gap: 12px; }
    .thanks-actions[hidden] { display: none; }
    .thanks .text-link { display: flex; width: fit-content; margin-top: var(--space-xl); color: var(--on-dark-soft); border-bottom: 1.5px solid currentColor; padding-bottom: 2px; }
    .thanks .text-link:hover { color: var(--white); }
    .thanks .shelf-unit { margin-inline: auto; }
    @media (max-width: 900px) { .thanks { grid-template-columns: 1fr; } .thanks .hero-visual { display: none; } }
  </style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="./" aria-label="FIFI, voltar para a página de revenda">
    <img class="brand-mark" src="img/logo-fifi-branco.webp" alt="FIFI" width="57" height="28">
    <span class="brand-sub">Revenda</span>
  </a>
</header>
<main class="thanks">
  <div>
    <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Recebemos seu contato.</h1>
    <p>Um consultor comercial da FIFI vai chamar você no WhatsApp. Enquanto isso, veja o catálogo completo.</p>
    <!-- Só aparecem para quem enviou o formulário (marca na sessão gravada pelo script.js).
         O WhatsApp do comercial só fica visível depois dos dados: não tem na página de revenda. -->
    <div class="thanks-actions" id="acoes-lead" hidden>
      <a class="button button-lime" href="https://drive.google.com/file/d/1ayT0qVXGJHj7anIxKqzI1nNpeeM00l9P/view?usp=sharing" target="_blank" rel="noopener">Ver catálogo</a>
      <a class="whats-circle" href="https://wa.me/5547991994731?text=Ol%C3%A1!%20Vim%20pela%20p%C3%A1gina%20de%20revenda%20da%20FIFI%20e%20quero%20saber%20como%20revender%20os%20produtos%20na%20minha%20loja." target="_blank" rel="noopener" aria-label="Falar com a FIFI no WhatsApp" title="Falar com a FIFI no WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.47-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.28-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 7c0 5.45-4.44 9.88-9.88 9.88m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.46 0 .1 5.33.1 11.89c0 2.1.55 4.14 1.6 5.95L0 24l6.34-1.65a12.06 12.06 0 0 0 5.71 1.45h.01c6.58 0 11.94-5.33 11.95-11.89a11.82 11.82 0 0 0-3.48-8.41"/></svg>
      </a>
    </div>
    <a class="text-link" href="https://www.fifilimpeza.com" target="_blank" rel="noopener">Conheça também a loja online</a>
  </div>
  <div class="hero-visual" aria-hidden="true">
    <div class="shelf-unit">
      <div class="shelf shelf-top">
        <div class="shelf-items">
          <img src="img/500ml-citrus-5d.webp?v=2" alt="" width="163" height="392">
          <img src="img/500ml-vidro-vip.webp" alt="" width="180" height="420">
          <img src="img/pet-textil-500ml.webp?v=2" alt="" width="197" height="472">
          <img src="img/500ml-limpa-rejunte.webp" alt="" width="180" height="420">
        </div>
        <div class="plank"></div>
      </div>
    </div>
  </div>
</main>
<script>
  /* Quem chega aqui sem ter enviado o formulário volta para ele. Se o navegador
     bloquear o sessionStorage, libera o botão: melhor que esconder de um lead real. */
  (function () {
    var enviou = true;
    try { enviou = sessionStorage.getItem("fifi_revenda_enviado") === "1"; } catch (e) {}
    if (enviou) document.getElementById("acoes-lead").hidden = false;
    else location.replace("./#formulario");
  })();
</script>
</body>
</html>
